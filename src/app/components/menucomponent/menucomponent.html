<div class="container">
  <mat-toolbar>
    <!-- 1. LOGO A LA IZQUIERDA -->
    <button class="logo-btn" type="button" (click)="irA('inicio')" aria-label="Ir al inicio">
      <img src="images/logo-blured.png" alt="Logo BlueRed" class="logo-img" />
    </button>

    <!-- 2. ENLACES: al hacer clic se desplaza hasta la sección -->
    <nav class="nav-links">
      <a mat-button (click)="irA('inicio')">Inicio</a>
      <a mat-button (click)="irA('nosotros')">Nosotros</a>
      <a mat-button (click)="irA('como-funciona')">Cómo funciona</a>
      <a mat-button (click)="irA('beneficios')">Beneficios</a>
      <a mat-button (click)="irA('contacto')">Contacto</a>
    </nav>

    <!-- ESPACIADOR -->
    <span class="spacer"></span>

    <!-- 3. BOTÓN DE SESIÓN A LA DERECHA -->
    @if (auth.isAuthenticated()) {
      @if (puedeVerPanel) {
        <button matButton type="button" class="btn-panel" routerLink="/dashboard">
          Ir al panel
        </button>
      }
      <span class="user-correo">{{ auth.getCorreo() }}</span>
      <button matButton type="button" class="btn-sesion" (click)="cerrarSesion()">
        Cerrar sesión
      </button>
    } @else {
      <button matButton type="button" class="btn-sesion" routerLink="/login">Iniciar sesión</button>
    }
  </mat-toolbar>
</div>
