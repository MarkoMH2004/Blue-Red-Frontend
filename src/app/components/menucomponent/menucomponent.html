<div class="container">
  <mat-toolbar>
    <button matIconButton class="example-icon" routerLink="/inicio" aria-label="Ir al inicio">
      <mat-icon>home</mat-icon>
    </button>

    

    <!-- EMPUJA TODO LO SIGUIENTE A LA DERECHA -->
    <span class="spacer"></span>

    @if (auth.isAuthenticated()) {
      <span class="user-correo">{{ auth.getCorreo() }}</span>
      <button matButton type="button" class="btn-sesion" (click)="cerrarSesion()">
        Cerrar sesión
      </button>
    } @else {
      <button matButton type="button" class="btn-sesion" routerLink="/login">Iniciar sesión</button>
    }
  </mat-toolbar>
</div>
