<div class="container">
  <mat-toolbar>

    <button
      matIconButton
      class="example-icon"
      routerLink="/inicio"
      aria-label="Ir al inicio"
    >
      <mat-icon>home</mat-icon>
    </button>

    <!-- ESPECIE -->
    <button
      matButton
      [matMenuTriggerFor]="menuEspecie"
      style="color: aliceblue"
    >
      Especie
    </button>

    <mat-menu #menuEspecie="matMenu">
      <button mat-menu-item routerLink="/especies/listar">
        Listar
      </button>

      <button mat-menu-item routerLink="/especies/insertar">
        Registrar
      </button>
    </mat-menu>

    <!-- LOTE DE CAPTURA -->
    <button
      matButton
      [matMenuTriggerFor]="menuLote"
      style="color: aliceblue"
    >
      Lote de captura
    </button>

    <mat-menu #menuLote="matMenu">
      <button mat-menu-item routerLink="/lotes-captura/listar">
        Mis capturas
      </button>

      <button mat-menu-item routerLink="/lotes-captura/insertar">
        Registrar lote
      </button>
    </mat-menu>

    <!-- VALIDACIONES (unificado: incluye Buscar de tu compañero + Reconocer IA de ambos) -->
    <button
      matButton
      [matMenuTriggerFor]="menuValidacion"
      style="color: aliceblue"
    >
      Validaciones
    </button>

    <mat-menu #menuValidacion="matMenu">
      <button mat-menu-item routerLink="/validaciones/listar">
        Listar
      </button>

      <button mat-menu-item routerLink="/validaciones/buscar">
        Buscar
      </button>

      <button
        mat-menu-item
        routerLink="/validaciones/reconocer-especie"
      >
        Reconocer especie con IA
      </button>
    </mat-menu>

    <!-- CERTIFICACIONES (solo de tu compañero) -->
    <button
      matButton
      [matMenuTriggerFor]="menuCertificacion"
      style="color: aliceblue"
    >
      Certificaciones
    </button>

    <mat-menu #menuCertificacion="matMenu">
      <button mat-menu-item routerLink="/certificaciones/listar">
        Listar
      </button>

      <button mat-menu-item routerLink="/certificaciones/insertar">
        Registrar
      </button>
    </mat-menu>

    <!-- DOCUMENTOS DE VENTA (solo de tu compañero) -->
    <button
      matButton
      [matMenuTriggerFor]="menuDocumentoVenta"
      style="color: aliceblue"
    >
      Documentos de venta
    </button>

    <mat-menu #menuDocumentoVenta="matMenu">
      <button mat-menu-item routerLink="/documentos-venta/listar">
        Listar / Consultar
      </button>

      <button mat-menu-item routerLink="/documentos-venta/insertar">
        Registrar
      </button>
    </mat-menu>

    <!-- REPORTES (solo tuyo) -->
    <button
      matButton
      [matMenuTriggerFor]="menuReport"
      style="color: aliceblue"
    >
      Reportes
    </button>

    <mat-menu #menuReport="matMenu">
      <button mat-menu-item routerLink="/reportes/veda">
        Reporte01
      </button>
    </mat-menu>

    <!-- EMPUJA TODO LO SIGUIENTE A LA DERECHA -->
    <span class="spacer"></span>

    @if (auth.isAuthenticated()) {
      <span class="user-correo">{{ auth.getCorreo() }}</span>
      <button
        matButton
        type="button"
        class="btn-sesion"
        (click)="cerrarSesion()"
      >
        Cerrar sesión
      </button>
    } @else {
      <button
        matButton
        type="button"
        class="btn-sesion"
        routerLink="/login"
      >
        Iniciar sesión
      </button>
    }

  </mat-toolbar>
</div>
