<h2>Registrar documento de venta</h2>

<form [formGroup]="formDocumentoVenta" (ngSubmit)="registrarDocumentoVenta()">
  <!-- Bloque A: datos del documento -->
  <mat-form-field appearance="outline">
    <mat-label>Tipo de documento</mat-label>
    <mat-select formControlName="tipoDocumento">
      <mat-option value="Factura">Factura</mat-option>
      <mat-option value="Boleta">Boleta</mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Bloque B: detalles de compra -->
  <div formArrayName="detalles">
    @for (d of detalles.controls; track $index) {
      <div [formGroupName]="$index">
        <mat-form-field appearance="outline">
          <mat-label>ID del lote de captura</mat-label>
          <input matInput type="number" formControlName="idLoteCaptura" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Peso comprado</mat-label>
          <input matInput type="number" formControlName="pesoComprado" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Subtotal</mat-label>
          <input matInput type="number" formControlName="subtotal" />
        </mat-form-field>
        <button mat-icon-button type="button" (click)="quitarDetalle($index)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    }
  </div>

  <button mat-button type="button" (click)="agregarDetalle()">+ Agregar otro detalle</button>

  <p>Monto total: S/ {{ montoTotal }}</p>

  <button mat-button type="button" routerLink="/documentos-venta">Cancelar</button>
  <button mat-flat-button type="submit">Registrar documento</button>

  <p>{{ mensaje }}</p>
</form>
